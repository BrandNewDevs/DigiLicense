# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"

reviews:
  profile: "chill"

  # ─────────────────────────────────────
  # PR OVERVIEW
  # ─────────────────────────────────────

  high_level_summary: true

  # Put the PR summary inside CodeRabbit's walkthrough comment
  high_level_summary_in_walkthrough: true

  # Tell CodeRabbit exactly what kind of overview we want
  high_level_summary_instructions: |
    Give reviewers a concise but useful overview of this pull request.

    Structure the summary as:

    ## PR Summary
    - Explain the purpose of the PR in 2-4 sentences.
    - Explain what major functionality or behavior changed.

    ## Key Changes
    - List the important architectural, frontend, backend, database,
      API, configuration, or dependency changes.
    - Group related changes instead of listing every file individually.

    ## Implementation Flow
    - Explain how the changed functionality works end-to-end.
    - Describe the flow between relevant components, pages, APIs,
      services, database layers, or utilities.
    - Keep this understandable for a reviewer who did not write the code.

    ## Review Focus
    - Mention the 2-5 areas a human reviewer should pay the most attention to.
    - Highlight security-sensitive or behavior-changing areas when applicable.

  # ─────────────────────────────────────
  # WALKTHROUGH
  # ─────────────────────────────────────

  review_status: true
  review_details: false

  # IMPORTANT: show walkthrough instead of hiding it
  collapse_walkthrough: false

  # Show grouped explanation of changed files
  changed_files_summary: true

  # Generate Mermaid flow/sequence diagrams when the PR has
  # meaningful component/API/service interactions
  sequence_diagrams: true

  # Useful context without making the comment too noisy
  estimate_code_review_effort: true

  # Keep unnecessary sections disabled
  suggested_labels: false
  suggested_reviewers: false
  related_issues: false
  related_prs: false

  # No gimmicks
  in_progress_fortune: false
  poem: false

  # CodeRabbit comments on issues but does NOT become
  # your approving reviewer
  request_changes_workflow: false

  # ─────────────────────────────────────
  # AUTOMATIC REVIEW
  # ─────────────────────────────────────

  auto_review:
    enabled: true
    drafts: false

  # ─────────────────────────────────────
  # OPTIONAL GENERATION FEATURES
  # ─────────────────────────────────────

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

chat:
  art: false
  auto_reply: true
