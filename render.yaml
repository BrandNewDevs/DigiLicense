services:
  - type: web
    name: digilicense
    runtime: docker
    dockerfilePath: Dockerfile.render
    plan: starter
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: digilicense-db
          property: connectionString
      - key: DIGILICENSE_SESSION_SECRET
        generateValue: true
      - key: DIGILICENSE_IDENTIFIER_HMAC_SECRET
        generateValue: true
      - key: DIGILICENSE_IDENTIFIER_HMAC_KEY_VERSION
        value: v1
      # Set to a random 6-digit number in the Render dashboard.
      # Rotate by updating the value and redeploying.
      - key: DIGILICENSE_MOCK_WORKFLOW_OTP
        sync: false
      - key: DIGILICENSE_PUBLIC_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production

databases:
  - name: digilicense-db
    plan: starter
    databaseName: digilicense
    user: digilicense
