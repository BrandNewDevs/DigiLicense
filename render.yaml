services:
  - type: web
    name: digilicense
    runtime: docker
    dockerfilePath: Dockerfile.render
    plan: starter
    healthCheckPath: /
    preDeployCommand: cd /workspace/packages/db && ./node_modules/.bin/prisma migrate deploy
    initialDeployHook: cd /workspace/packages/db && ./node_modules/.bin/tsx prisma/seed.ts
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIGILICENSE_SESSION_SECRET
        generateValue: true
      - key: DIGILICENSE_IDENTIFIER_HMAC_SECRET
        generateValue: true
      - key: DIGILICENSE_IDENTIFIER_HMAC_KEY_VERSION
        value: v1
      # Required only for synthetic applicant sign-in. Set a random 6-digit
      # value in the Render dashboard and rotate it between demonstrations.
      - key: DIGILICENSE_DEMO_APPLICANT_OTP
        sync: false
      - key: DIGILICENSE_PUBLIC_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production

  - type: cron
    name: digilicense-maintenance
    runtime: docker
    dockerfilePath: Dockerfile.render
    dockerCommand: sh /workspace/docker/render-maintenance.sh
    schedule: "* * * * *"
    plan: starter
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
