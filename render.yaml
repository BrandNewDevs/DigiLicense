services:
  - type: web
    name: digilicense
    runtime: docker
    dockerfilePath: Dockerfile.render
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: digilicense-db
          property: connectionString
      - key: DIGILICENSE_SESSION_SECRET
        generateValue: true
      - key: DIGILICENSE_IDENTIFIER_HMAC_SECRET
        generateValue: true
      - key: DIGILICENSE_IDENTIFIER_HMAC_KEY_VERSION
        value: v1
      - key: DIGILICENSE_MOCK_WORKFLOW_OTP
        value: "123456"
      - key: DIGILICENSE_PUBLIC_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production

databases:
  - name: digilicense-db
    plan: free
    databaseName: digilicense
    user: digilicense
