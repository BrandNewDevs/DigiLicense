services:
  - type: web
    name: digilicense
    runtime: docker
    dockerfilePath: Dockerfile.render
    plan: starter
    healthCheckPath: /
    preDeployCommand: cd /workspace/packages/db && ./node_modules/.bin/prisma migrate deploy
    initialDeployHook: cd /workspace/packages/db && ./node_modules/.bin/tsx prisma/seed.ts
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIGILICENSE_SESSION_SECRET
        generateValue: true
      - key: DIGILICENSE_IDENTIFIER_HMAC_SECRET
        generateValue: true
      - key: DIGILICENSE_IDENTIFIER_HMAC_KEY_VERSION
        value: v1
      # Required only for synthetic applicant sign-in. Set a random 6-digit
      # value in the Render dashboard and rotate it between demonstrations.
      - key: DIGILICENSE_DEMO_APPLICANT_OTP
        sync: false
      - key: DIGILICENSE_PUBLIC_ORIGIN
        sync: false
      # Render copies the AI service's managed HTTPS URL and generated bearer
      # credential directly into the web server. Neither value is exposed to
      # browser bundles or duplicated by an operator.
      - key: DIGILICENSE_AI_BASE_URL
        fromService:
          name: digilicense-ai
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DIGILICENSE_AI_SERVICE_BEARER_TOKEN
        fromService:
          name: digilicense-ai
          type: web
          envVarKey: DIGILICENSE_AI_SERVICE_BEARER_TOKEN
      - key: NODE_ENV
        value: production

  - type: cron
    name: digilicense-maintenance
    runtime: docker
    dockerfilePath: Dockerfile.render
    dockerCommand: sh /workspace/docker/render-maintenance.sh
    schedule: "* * * * *"
    plan: starter
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production

  # Render-managed HTTPS protects the server-to-server AI hop. The AI service
  # has no product database credentials and is never called by browser code.
  - type: web
    name: digilicense-ai
    runtime: docker
    dockerContext: packages/ai-service
    dockerfilePath: packages/ai-service/Dockerfile
    plan: starter
    healthCheckPath: /health/ready
    envVars:
      - key: PORT
        value: "8000"
      - key: DIGILICENSE_AI_PROFILE
        value: production
      - key: DIGILICENSE_AI_PROVIDER_BACKEND
        value: openai
      - key: DIGILICENSE_AI_RETRIEVAL_BACKEND
        value: bm25
      - key: DIGILICENSE_AI_DLP_BACKEND
        value: local
      - key: DIGILICENSE_AI_CONTEXT_BACKEND
        value: local
      - key: DIGILICENSE_AI_INTENT_BACKEND
        value: local
      - key: DIGILICENSE_AI_SERVICE_BEARER_TOKEN
        generateValue: true
      - key: DIGILICENSE_AI_CONTEXT_SIGNING_CURRENT_KEY
        generateValue: true
      - key: DIGILICENSE_AI_REQUIRE_TLS
        value: "true"
      - key: DIGILICENSE_AI_OPENAI_BUDGET_CONTROLS_CONFIRMED
        value: "true"
      - key: DIGILICENSE_AI_OPENAI_API_KEY
        sync: false
      - key: DIGILICENSE_AI_OPENAI_PROJECT_ID
        sync: false
