name: Web backend

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/ai-service/**"
      - "packages/db/**"
      - "compose.yaml"
      - "docker/postgres/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "render.yaml"
      - ".github/workflows/web-backend.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/ai-service/**"
      - "packages/db/**"
      - "compose.yaml"
      - "docker/postgres/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "render.yaml"
      - ".github/workflows/web-backend.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://digilicense:integration-only-password@localhost:5432/digilicense_integration?sslmode=require&uselibpqcompat=true
      DIGILICENSE_IDENTIFIER_HMAC_KEY_VERSION: v1
      DIGILICENSE_IDENTIFIER_HMAC_SECRET: integration-only-hmac-secret-at-least-32-characters
      DIGILICENSE_INTEGRATION_TEST: "true"
      DIGILICENSE_AI_BASE_URL: http://127.0.0.1:8000
      DIGILICENSE_AI_INTEGRATION_TEST: "true"
      DIGILICENSE_AI_SERVICE_BEARER_TOKEN: integration-only-ai-service-credential-12345
      DIGILICENSE_LOCAL_DB_PASSWORD: integration-only-password
      DIGILICENSE_MOCK_WORKFLOW_OTP: "123456"
      DIGILICENSE_POSTGRES_DB: digilicense_integration
      DIGILICENSE_PUBLIC_ORIGIN: https://digilicense.example
      DIGILICENSE_SESSION_SECRET: integration-only-session-secret-at-least-32-characters
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.12"

      - name: Prepare Compose web environment
        # Compose validates declared env_file paths even when only the db
        # service is started. This file is created only in the CI workspace;
        # the job-level fixed integration values override its placeholders.
        run: cp apps/web/.env.example apps/web/.env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install private AI fixture
        working-directory: packages/ai-service
        run: uv sync --frozen --no-dev

      - name: Generate Prisma client
        run: pnpm --filter @digilicense/db db:generate

      - name: Run unit tests
        run: pnpm --filter web test

      - name: Lint web application
        run: pnpm --filter web lint

      - name: Typecheck web application
        run: pnpm --filter web typecheck

      - name: Build production web application
        env:
          NODE_ENV: production
        run: pnpm --filter web build

      - name: Start private FastAPI fixture
        working-directory: packages/ai-service
        env:
          DIGILICENSE_AI_PROFILE: test
        run: |
          .venv/bin/uvicorn digilicense_ai.main:app --host 127.0.0.1 --port 8000 --workers 1 --no-access-log > /tmp/digilicense-ai.log 2>&1 &
          echo "$!" > /tmp/digilicense-ai.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "FastAPI fixture did not become ready within 30 seconds." >&2
          exit 1

      - name: Verify TanStack to FastAPI contract
        run: pnpm test:ai-integration

      - name: Start TLS PostgreSQL integration database
        run: docker compose up --detach db

      - name: Wait for PostgreSQL health
        run: |
          for attempt in $(seq 1 30); do
            container_id="$(docker compose ps --quiet db)"
            if [ -n "$container_id" ] && [ "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become healthy within 60 seconds." >&2
          exit 1

      - name: Deploy checked-in Prisma migrations
        run: pnpm --filter @digilicense/db db:migrate:deploy

      - name: Run PostgreSQL integration tests
        run: pnpm test:integration

      - name: Seed browser-test applicant data
        run: pnpm --filter @digilicense/db db:seed

      - name: Install Chromium for browser checks
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run browser accessibility and responsive smoke tests
        env:
          DIGILICENSE_PUBLIC_ORIGIN: http://localhost:3000
        run: pnpm test:e2e

      - name: Upload browser diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Show PostgreSQL logs after failure
        if: failure()
        run: docker compose logs db

      - name: Show private AI logs after failure
        if: failure()
        run: test ! -f /tmp/digilicense-ai.log || sed -n '1,240p' /tmp/digilicense-ai.log

      - name: Stop private AI fixture
        if: always()
        run: test ! -f /tmp/digilicense-ai.pid || kill "$(cat /tmp/digilicense-ai.pid)" 2>/dev/null || true

      - name: Tear down integration database
        if: always()
        run: docker compose down --volumes --remove-orphans
